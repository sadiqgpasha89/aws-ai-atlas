name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate service data
        run: node scripts/check.mjs
      - name: Check assets/app.js is generated from scripts/build_app.mjs
        run: |
          node scripts/build_app.mjs
          git diff --exit-code -- assets/app.js || { echo "assets/app.js is out of date. Run: node scripts/build_app.mjs"; exit 1; }
      - name: Syntax-check app and workspace modules
        run: |
          node --check assets/app.js
          node --check assets/search.js
          node --check assets/theme.js
          for f in assets/lib/*.js assets/ui/*.js data/demo.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/*.test.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
