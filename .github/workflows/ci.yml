name: CI

# Runs on every pull request and on pushes to any branch except main (main is checked by the Pages workflow).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Data checks, generated-file check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: assets/app.js must be generated from scripts/build_app.mjs
        run: |
          node scripts/build_app.mjs
          git diff --exit-code -- assets/app.js || { echo "assets/app.js is out of date. Run: node scripts/build_app.mjs"; exit 1; }
      - run: npm test

  smoke:
    name: Browser smoke test (all routes, search, calculators)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (not a repo dependency; the site itself has no build step)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - run: npm run smoke
